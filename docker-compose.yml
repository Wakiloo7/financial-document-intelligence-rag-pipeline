services:
  financial-rag-api:
    build: .
    container_name: financial-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./outputs:/app/outputs
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
